name: build-app-amd64

# Fork-only helper for a self-hosted deployment: publishes just the application image for
# linux/amd64 into this fork's GHCR namespace, so a VPS or Swarm host can pull the same
# source-addressed tag the upstream workflow publishes, without also building the updater
# and computer images it does not need. The upstream workflow is left untouched.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        default: modal-sandbox-provider

permissions:
  contents: read

jobs:
  build:
    name: Build app amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
      - name: Read the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/compose/Dockerfile
          platforms: linux/amd64
          push: true
          # Same tag contract as the upstream publish workflow: source-addressed, never moves.
          tags: ghcr.io/${{ github.repository }}/app:sha-${{ steps.source.outputs.sha }}
          # GET /health can report the exact source commit without a deployment-supplied override.
          build-args: GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,mode=max,scope=app-amd64
          provenance: false
          sbom: false
